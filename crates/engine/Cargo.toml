[package]
name = "swmm5-rust"
description = "EPA SWMM 5.2.4 in safe Rust: every simulation an object, no unsafe code, byte-identical results"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "swmm5_rust"
path = "src/lib.rs"

[features]
# In-memory files, no clock: for hosts with no file system (the RustGIS
# plugin, wasm32-unknown-unknown). Off by default; the default build is unchanged.
# Not additive: it replaces disk I/O, so never turn it on for runswmm-rs or the C
# interface (`--all-features` in this workspace would).
memfs = []

[dev-dependencies]
libc = "0.2"
